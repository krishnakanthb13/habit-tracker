<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED; stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#primaryGradient)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="160" stroke="white" stroke-width="24" fill="none" opacity="0.3" />
  <circle cx="256" cy="256" r="100" stroke="white" stroke-width="24" fill="none" opacity="0.6" />
  <circle cx="256" cy="256" r="40" fill="white" />
</svg>
